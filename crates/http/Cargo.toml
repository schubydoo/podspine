[package]
name = "podspine-http"
description = "Axum router: feed, audio (Range), and health routes with tower-http timeout/limit layers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
axum-range = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5", features = ["limit"] }
tokio = { workspace = true }
podspine-index = { path = "../index" }
podspine-feed = { path = "../feed" }
podspine-splitter = { path = "../splitter" }
podspine-ui = { path = "../ui" }
podspine-metrics = { path = "../metrics" }
tracing = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
podspine-scanner = { path = "../scanner" }
podspine-test-support = { path = "../test-support" }
# Fault injection: a second connection to the same SQLite file, to break the
# schema out from under a live Index.
rusqlite = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
