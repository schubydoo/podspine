name: Release

# On a `v*` tag: build release binaries for Linux (static musl amd64+arm64,
# via zig), macOS (Intel + Apple Silicon), and Windows (x86_64). Generate
# SBOMs. Sign the checksums with keyless cosign. Attach a SLSA
# build-provenance file. Publish a GitHub Release. Push a multi-arch (Linux)
# image to GHCR (with provenance, SBOM, and a cosign signature). TAD §6.4.
#
# OpenSSF Scorecard: Signed-Releases needs the cosign `.sigstore.json`
# signatures plus a `*.intoto.jsonl` SLSA provenance file; SBOM needs the
# CycloneDX SBOMs as release assets.
#
# Cut a release: `git tag v1.0.0 && git push origin v1.0.0`.
#
# NOTE: action refs are pinned to full commit SHAs (the repo's Actions policy
# requires it; also satisfies Scorecard Pinned-Dependencies); Renovate keeps them current.

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs elevate explicitly.
permissions:
  contents: read

concurrency:
  # Releases must not cancel each other: a half-published release is worse
  # than two serialized runs.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build ${{ matrix.name }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not let one platform's failure cancel the others: a release run
      # must show every target's result.
      fail-fast: false
      matrix:
        include:
          # Linux: cross-compiled static musl from an x86_64 runner via zig.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-amd64
            build: zig
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64
            build: zig
          # macOS + Windows: use the platform's native toolchain (cargo
          # build), not zig. Native is exactly what CI already exercises
          # (green macos + windows test jobs), and rusqlite's bundled SQLite C
          # compiles with clang / MSVC cl.exe. Both darwin arches build on one
          # Apple-Silicon runner: the macOS SDK is universal, so
          # x86_64-apple-darwin cross-compiles cleanly there (macos-13, the
          # old Intel runner, has been retired by GitHub).
          - target: aarch64-apple-darwin
            os: macos-14
            name: darwin-arm64
            build: native
          - target: x86_64-apple-darwin
            os: macos-14
            name: darwin-amd64
            build: native
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-amd64
            build: native
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      # zig is the cross linker for the musl targets only (incl. rusqlite's bundled
      # SQLite C). mlugg/setup-zig is the maintained successor to the abandoned
      # goto-bus-stop/setup-zig.
      - if: matrix.build == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          # No Actions cache in this signed-release build: it's tag-triggered (rare),
          # and caching in an artifact-publishing workflow is a cache-poisoning vector
          # (zizmor cache-poisoning).
          use-cache: false
      - if: matrix.build == 'zig'
        name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - if: matrix.build == 'zig'
        name: Build (musl via zig)
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin podspine
      - if: matrix.build == 'native'
        name: Build (native)
        run: cargo build --release --target ${{ matrix.target }} --bin podspine
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/podspine${{ matrix.ext }}" \
             "dist/${{ matrix.name }}/podspine${{ matrix.ext }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: dist/${{ matrix.name }}/podspine${{ matrix.ext }}
          retention-days: 1

  release:
    name: Sign + provenance + GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # Sigstore keyless (Fulcio OIDC) + provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - name: Fetch built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Assemble, SBOM, checksum, and sign
        id: assemble
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # download-artifact laid each build down at artifacts/dist-<name>/podspine[.exe]
          # (name = linux-amd64, darwin-arm64, windows-amd64, …). Rename each into a
          # release asset, preserving a .exe suffix for Windows.
          for d in artifacts/dist-*; do
            name="${d#artifacts/dist-}"
            if [ -f "$d/podspine.exe" ]; then
              cp "$d/podspine.exe" "release/podspine-${TAG}-${name}.exe"
            else
              cp "$d/podspine" "release/podspine-${TAG}-${name}"
            fi
          done
          cd release
          # One SBOM per binary (skip any SBOM already present, so that the
          # loop never SBOMs a SBOM).
          for f in podspine-${TAG}-*; do
            case "$f" in *.sbom.cdx.json) continue ;; esac
            syft "$f" -o "cyclonedx-json=${f}.sbom.cdx.json"
          done
          # One checksums file over binaries + SBOMs, each listed exactly
          # once; cosign signs it, so a verifier trusts every artifact
          # transitively through its hash. (A single podspine-${TAG}-* glob
          # now covers binaries AND their SBOMs: the old two-glob form
          # double-counted the SBOMs.)
          sha256sum podspine-${TAG}-* > checksums.txt
          cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes
      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - name: Attach provenance as a release asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE" ] || { echo "no provenance bundle produced" >&2; exit 1; }
          cp "$BUNDLE" release/podspine.intoto.jsonl
      # Publish via the runner's built-in gh CLI instead of a third-party action
      # (zizmor superfluous-actions). Create-or-update: knope-release may have
      # already created the Release (with CHANGELOG notes) before this tag-triggered
      # run, so attach assets to it; otherwise (manual/Knope-off tag) create it.
      # GH_REPO lets gh resolve the repo without a checkout in this job.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            release/podspine-${TAG}-*
            release/checksums.txt
            release/checksums.txt.sigstore.json
            release/podspine.intoto.jsonl
          )
          # A tag with a hyphen (v1.0.0-rc.1, -beta …) is a pre-release: mark
          # it, so that it does not become the repo's "Latest release". This
          # is the SemVer pre-release marker.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes $prerelease
          fi

  image:
    name: Multi-arch image → GHCR (provenance + signed)
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Lay out dist/ for the Dockerfile
        # The image is Linux-only; it consumes just the two musl binaries (the
        # Dockerfile selects dist/${TARGETARCH}/podspine). macOS/Windows artifacts
        # are ignored here.
        run: |
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/dist-linux-amd64/podspine dist/amd64/podspine
          cp artifacts/dist-linux-arm64/podspine dist/arm64/podspine
          chmod +x dist/amd64/podspine dist/arm64/podspine
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Only move :latest for a stable release; a pre-release tag (v1.0.0-rc.1)
            # must not claim :latest. type=semver already skips {{major}}.{{minor}} for
            # pre-releases, but type=raw is unconditional, so guard it explicitly.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # SLSA provenance attestation in the registry
          sbom: true
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
