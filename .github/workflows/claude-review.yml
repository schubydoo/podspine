name: Claude review

# On-demand PR review: comment "@claude review" on a pull request.
# The job and all its settings live in schubydoo/shared-workflows. This file only calls it.

on:
  # A comment starts the review, so this trigger is required.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    # A called workflow gets no more permissions than the caller grants.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: schubydoo/shared-workflows/.github/workflows/claude-review.yml@dc075177c2f5563dd116397888c3958c9db8cab3 # v1.0.8
    secrets:
      app-client-id: ${{ secrets.PODSPINE_CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.PODSPINE_CI_APP_PRIVATE_KEY }}
      # Only for the `auth: oauth` fallback.
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
